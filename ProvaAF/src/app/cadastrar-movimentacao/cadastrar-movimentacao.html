<div class="container">
  <h2>{{ id ? 'Editar movimentação' : 'Nova movimentação' }}</h2>

  <form (ngSubmit)="salvar()">
    <div>
      <label>Descrição</label>
      <input [(ngModel)]="descricao" name="descricao" required />
    </div>

    <div>
      <label>Tipo</label>
      <label><input type="radio" name="tipo" value="entrada" [(ngModel)]="tipo" /> Entrada</label>
      <label><input type="radio" name="tipo" value="saida" [(ngModel)]="tipo" /> Saída</label>
    </div>

    <div>
      <label>Categoria</label>
      <select [(ngModel)]="categoria" name="categoria" required>
        <option value="" disabled>Selecione</option>
        @for (c of categorias; track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </div>

    <div>
      <label>Valor (R$)</label>
      <input type="number" step="0.01" min="0.01" [(ngModel)]="valor" name="valor" required />
    </div>

    <div>
      <label>Data</label>
      <input type="date" [(ngModel)]="data" name="data" required />
    </div>

    <button type="submit" [disabled]="salvando()">Salvar</button>
  </form>

  @if (erro()) {
    <p style="color: red">{{ erro() }}</p>
  }

  <a routerLink="/lista">Voltar para a lista</a>
</div>
